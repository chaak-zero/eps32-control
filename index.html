<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluetooth 充電制御</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    button { font-size: 18px; padding: 15px 30px; margin: 10px; border-radius: 8px; border: none; background: #007aff; color: white; }
    .off { background: #ff3b30; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>ESP32 充電制御 (Web Bluetooth)</h2>
  <p>「デバイスに接続しますか？」が表示されたらタップしてください。</p>

  <button id="connectBtn" onclick="connectAndSend()">デバイスに接続して実行</button>
  <div id="status">待機中...</div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const CHARACTERISTIC_UUID_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    // URLパラメーターから cmd=off または cmd=on を取得
    const urlParams = new URLSearchParams(window.location.search);
    const cmdParam = urlParams.get('cmd') ? urlParams.get('cmd').toUpperCase() : 'OFF';

    document.getElementById('status').innerText = `実行予定コマンド: ${cmdParam}`;

    async function connectAndSend() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "接続処理中...";

      try {
        // Bluetooth機器の検索と接続ダイアログの表示
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32-PowerControl' }],
          optionalServices: [SERVICE_UUID]
        });

        statusDiv.innerText = "デバイス接続中...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);

        // コマンド送信
        const encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(cmdParam));

        statusDiv.innerText = `送信成功: ${cmdParam} (充電制御完了)`;

        // 送信後に自動切断
        setTimeout(() => {
          device.gatt.disconnect();
          statusDiv.innerText += " -> 切断完了";
        }, 1000);

      } catch (error) {
        console.error(error);
        statusDiv.innerText = "エラー: " + error.message;
      }
    }
  </script>
</body>
</html>
