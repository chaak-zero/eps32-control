<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 充電制御</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { padding: 15px 25px; font-size: 18px; margin: 10px 5px; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; font-size: 16px; color: #333; }
  </style>
</head>
<body>
  <h2>ESP32 充電制御</h2>
  
  <button onclick="sendCmd('off')">充電停止 (OFF)</button>
  <button onclick="sendCmd('on')">充電開始 (ON)</button>

  <div id="status">待機中</div>

  <script>
    var SERVICE_UUID        = "4fa8f24c-038e-45b0-93e9-2b006836c256";
    var CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function sendCmd(cmd) {
      if (!cmd) return;
      
      var statusEl = document.getElementById("status");
      var sendString = cmd.toString().trim().toUpperCase();
      statusEl.textContent = "送信中: " + sendString + "...";

      try {
        // ① ペアリング済みデバイスを取得試行
        var device = null;
        if (navigator.bluetooth && navigator.bluetooth.getDevices) {
          var devices = await navigator.bluetooth.getDevices();
          for (var i = 0; i < devices.length; i++) {
            if (devices[i].name === 'ESP32_Charge_Controller') {
              device = devices[i];
              break;
            }
          }
        }

        // ② 見つからなければ新規ペアリング要求（ダイアログ表示）
        if (!device) {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'ESP32_Charge_Controller' }],
            optionalServices: [SERVICE_UUID]
          });
        }

        // ③ GATT接続と送信
        var server = await device.gatt.connect();
        var service = await server.getPrimaryService(SERVICE_UUID);
        var characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        var encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(sendString));

        statusEl.textContent = "送信成功: " + sendString;

        // ④ 300ms待ってから安全に切断
        await new Promise(function(resolve) { setTimeout(resolve, 300); });
        if (device.gatt.connected) {
          await device.gatt.disconnect();
        }

      } catch (error) {
        statusEl.textContent = "エラー: " + error.message;
        console.log("BLE Error: ", error);
      }
    }

    // URLパラメータの自動実行処理
    window.onload = function() {
      var urlParams = new URLSearchParams(window.location.search);
      var cmd = urlParams.get('cmd');
      
      if (cmd) {
        setTimeout(function() {
          sendCmd(cmd);
          window.history.replaceState({}, document.title, window.location.pathname);
        }, 500);
      }
    };
  </script>
</body>
</html>
