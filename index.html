<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 充電制御</title>
</head>
<body>
  <h2>ESP32 充電制御</h2>
  <button onclick="sendCmd('off')">充電停止 (OFF)</button>
  <button onclick="sendCmd('on')">充電開始 (ON)</button>

  <script>
    const SERVICE_UUID        = "4fa8f24c-038e-45b0-93e9-2b006836c256";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function sendCmd(cmd) {
      if (!cmd) return;
      const sendString = cmd.trim().toUpperCase();

      try {
        let device = null;

        // ① すでに過去に許可したデバイスがあるか確認（ダイアログを出さない）
        if (navigator.bluetooth.getDevices) {
          const devices = await navigator.bluetooth.getDevices();
          device = devices.find(d => d.name === 'ESP32_Charge_Controller');
        }

        // ② 記憶されたデバイスがない場合のみ、ペアリング画面を表示する
        if (!device) {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'ESP32_Charge_Controller' }],
            optionalServices: [SERVICE_UUID]
          });
        }

        // GATT接続してデータを送信
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        const encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(sendString));

        await new Promise(resolve => setTimeout(resolve, 300));
        // 自動切断は行わず、接続保持（必要に応じて）
      } catch (error) {
        console.log("BLE Error: " + error);
      }
    }

    // URLパラメータ（ショートカット等）での起動時
    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cmd = urlParams.get('cmd');
      
      if (cmd) {
        await new Promise(r => setTimeout(r, 300));
        await sendCmd(cmd);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    };
  </script>
</body>
</html>
