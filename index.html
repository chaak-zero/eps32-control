<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 充電制御</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { padding: 15px 25px; font-size: 18px; margin: 10px 5px; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; font-size: 16px; color: #333; word-break: break-all; }
  </style>
</head>
<body>
  <h2>ESP32 充電制御</h2>
  
  <button onclick="sendCmd('off')">充電停止 (OFF)</button>
  <button onclick="sendCmd('on')">充電開始 (ON)</button>

  <div id="status">待機中</div>

  <script>
    var SERVICE_UUID        = "4fa8f24c-038e-45b0-93e9-2b006836c256";
    var CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function sendCmd(cmd) {
      if (!cmd) return;
      
      var statusEl = document.getElementById("status");
      var sendString = cmd.toString().trim().toUpperCase();
      statusEl.textContent = "送信中: " + sendString + "...";

      try {
        // デバイス選択要求（ダイアログを表示）
        var device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Charge_Controller' }],
          optionalServices: [SERVICE_UUID]
        });

        statusEl.textContent = "接続中...";
        var server = await device.gatt.connect();
        var service = await server.getPrimaryService(SERVICE_UUID);
        var characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        var encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(sendString));

        statusEl.textContent = "送信成功: " + sendString;

        // 300ms後に接続を切断
        await new Promise(function(resolve) { setTimeout(resolve, 300); });
        if (device.gatt.connected) {
          await device.gatt.disconnect();
        }

      } catch (error) {
        // エラーオブジェクトを安全に文字列化して表示
        var errMsg = error && error.message ? error.message : String(error);
        statusEl.textContent = "エラー: " + errMsg;
      }
    }

    // URLパラメータ（ショートカット起動時）
    window.onload = function() {
      var urlParams = new URLSearchParams(window.location.search);
      var cmd = urlParams.get('cmd');
      
      if (cmd) {
        setTimeout(function() {
          sendCmd(cmd);
          window.history.replaceState({}, document.title, window.location.pathname);
        }, 500);
      }
    };
  </script>
</body>
</html>
