<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 充電制御</title>
</head>
<body>
  <h2>ESP32 充電制御</h2>
  <button onclick="sendCmd('off')">充電停止 (OFF)</button>
  <button onclick="sendCmd('on')">充電開始 (ON)</button>

  <script>
    const SERVICE_UUID        = "4fa8f24c-038e-45b0-93e9-2b006836c256";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function sendCmd(cmd) {
      let device = null;
      try {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Charge_Controller' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        const encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(cmd.toUpperCase()));

        // データ送信完了後、少し待ってから明示的に切断
        await new Promise(resolve => setTimeout(resolve, 300));
        await device.gatt.disconnect();
      } catch (error) {
        // エラーダイアログを出さずにログのみ出力
        console.log("BLE Notice: " + error);
      }
    }

    // URLパラメータ(?cmd=off や ?cmd=on)の自動実行処理
    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cmd = urlParams.get('cmd');
      if (cmd) {
        await sendCmd(cmd);
        // パラメータを消去して次回の自動読み込みを正常化
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    };
  </script>
</body>
</html>
