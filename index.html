<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 充電制御</title>
</head>
<body>
  <h2>ESP32 充電制御</h2>
  <button onclick="sendCmd('o')">充電停止 (OFF)</button>
  <button onclick="sendCmd('on')">充電開始 (ON)</button>

  <script>
    const SERVICE_UUID        = "4fa8f24c-038e-45b0-93e9-2b006836c256";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function sendCmd(cmd) {
      let device = null;
      // 最大2回まで自動再試行
      for (let attempt = 1; attempt <= 2; attempt++) {
        try {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'ESP32_Charge_Controller' }],
            optionalServices: [SERVICE_UUID]
          });

          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

          const encoder = new TextEncoder();
          await characteristic.writeValue(encoder.encode(cmd.toUpperCase()));

          await new Promise(resolve => setTimeout(resolve, 300));
          await device.gatt.disconnect();
          return true; // 成功したらループを抜ける
        } catch (error) {
          console.log(`Attempt ${attempt} failed: ${error}`);
          // 1回目失敗時は1秒待って再試行
          if (attempt === 1) {
            await new Promise(r => setTimeout(r, 1000));
          }
        }
      }
      return false;
    }

    // URLパラメータの自動実行
    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cmd = urlParams.get('cmd');
      if (cmd) {
        // 少し待ってから通信を開始（Bluefyの描画完了を待つ）
        await new Promise(r => setTimeout(r, 500));
        await sendCmd(cmd);
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    };
  </script>
</body>
</html>
