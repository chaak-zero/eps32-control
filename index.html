<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>充電制御 (Web Bluetooth)</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    button { font-size: 20px; padding: 18px 36px; border-radius: 12px; border: none; background: #007aff; color: white; width: 100%; max-width: 300px; }
    #status { margin-top: 20px; color: #555; }
  </style>
</head>
<body>

  <button onclick="startBleProcess()">デバイスに接続</button>
  <div id="status">ボタンを押すと接続ダイアログが表示されます</div>

  <script>
    // 先ほど提示いただいたESP32のコード内のUUIDと完全一致させています
    const SERVICE_UUID        = "4fa8f24c-038e-45b0-93e9-2b006836c256";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // URLパラメーターから cmd=off や cmd=on を取得
    const urlParams = new URLSearchParams(window.location.search);
    const cmd = (urlParams.get('cmd') || 'off').toLowerCase();

    async function startBleProcess() {
      const statusDiv = document.getElementById('status');
      
      try {
        // ★ ここでiOS / Bluefy 標準の「デバイスに接続しますか？」ポップアップが直接呼び出されます
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32_Charge_Controller' }],
          optionalServices: [SERVICE_UUID]
        });

        statusDiv.innerText = "接続中...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // コマンド（"off" または "on"）を送信
        const encoder = new TextEncoder();
        await characteristic.writeValue(encoder.encode(cmd));

        statusDiv.innerText = `送信完了: ${cmd.toUpperCase()}`;

        // 送信完了後に自動切断
        setTimeout(() => {
          device.gatt.disconnect();
          statusDiv.innerText += " (切断完了)";
        }, 1000);

      } catch (error) {
        statusDiv.innerText = "キャンセルまたはエラー: " + error.message;
      }
    }
  </script>
</body>
</html>
